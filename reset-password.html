<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser Mot de Passe - Pronósticos Copa del Mundo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        .warning-box h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .warning-box p {
            color: #856404;
            margin: 5px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-reset:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-list {
            background: #6c757d;
            color: white;
        }

        .btn-list:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            display: block;
        }

        .participants-list {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .participants-list.show {
            display: block;
        }

        .participants-list h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .participant-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }

        .participant-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .participant-item strong {
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Réinitialiser Mot de Passe</h1>
        <p class="subtitle">Outil administrateur pour changer le mot de passe d'un participant</p>

        <div class="warning-box">
            <h3>⚠️ Attention</h3>
            <p>Cet outil est réservé aux administrateurs uniquement.</p>
            <p>Le nouveau mot de passe sera défini sans connaître l'ancien.</p>
        </div>

        <div class="form-group">
            <label for="participantName">Nom du participant</label>
            <input type="text" id="participantName" placeholder="Ex: Beatriz, noragil@gmail.com, etc.">
        </div>

        <div class="form-group">
            <label for="newPassword">Nouveau mot de passe</label>
            <input type="text" id="newPassword" placeholder="Minimum 4 caractères">
        </div>

        <div class="button-group">
            <button class="btn-reset" id="resetBtn">
                🔄 Réinitialiser le mot de passe
            </button>
            <button class="btn-list" id="listBtn">
                📋 Liste des participants
            </button>
        </div>

        <div id="status" class="status"></div>

        <div id="participantsList" class="participants-list">
            <h3>📋 Participants dans Firebase</h3>
            <div id="participantsContent"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const participantNameInput = document.getElementById('participantName');
        const newPasswordInput = document.getElementById('newPassword');
        const resetBtn = document.getElementById('resetBtn');
        const listBtn = document.getElementById('listBtn');
        const statusDiv = document.getElementById('status');
        const participantsList = document.getElementById('participantsList');
        const participantsContent = document.getElementById('participantsContent');

        // Fonction de hachage (même que dans participant.js)
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }

        // Normaliser l'ID du participant (même que dans participant.js)
        function normalizeParticipantId(name) {
            return name
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim()
                .replace(/\s+/g, "-")
                .replace(/\./g, "_dot_")
                .replace(/\$/g, "_dollar_")
                .replace(/#/g, "_hash_")
                .replace(/\[/g, "_lbracket_")
                .replace(/\]/g, "_rbracket_")
                .replace(/\//g, "_slash_")
                .replace(/@/g, "_at_");
        }

        function showStatus(message, type = 'info') {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }

        async function resetPassword() {
            const participantName = participantNameInput.value.trim();
            const newPassword = newPasswordInput.value.trim();

            if (!participantName) {
                showStatus('❌ Veuillez entrer le nom du participant', 'error');
                return;
            }

            if (!newPassword) {
                showStatus('❌ Veuillez entrer un nouveau mot de passe', 'error');
                return;
            }

            if (newPassword.length < 4) {
                showStatus('❌ Le mot de passe doit contenir au moins 4 caractères', 'error');
                return;
            }

            try {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<div class="spinner"></div>Réinitialisation en cours...';
                showStatus('🔄 Recherche du participant...', 'info');

                const db = firebase.database();
                const participantId = normalizeParticipantId(participantName);
                const participantRef = db.ref('participants/' + participantId);
                
                const snapshot = await participantRef.once('value');
                
                if (!snapshot.exists()) {
                    showStatus(`❌ Participant "${participantName}" non trouvé dans Firebase`, 'error');
                    return;
                }

                // Récupérer les données existantes
                const existingData = snapshot.val();
                
                // Calculer le nouveau hash
                const newPasswordHash = hashPassword(newPassword);
                
                // Mettre à jour uniquement le mot de passe
                const updatedData = {
                    ...existingData,
                    passwordHash: newPasswordHash
                };
                
                // Supprimer l'ancien champ password s'il existe
                delete updatedData.password;
                
                // Sauvegarder dans Firebase
                await participantRef.set(updatedData);
                
                showStatus(`✅ Mot de passe réinitialisé avec succès pour "${participantName}"!\n\nNouveau mot de passe: ${newPassword}`, 'success');
                
                // Effacer les champs
                newPasswordInput.value = '';
                
            } catch (error) {
                console.error('Erreur:', error);
                showStatus(`❌ Erreur lors de la réinitialisation: ${error.message}`, 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '🔄 Réinitialiser le mot de passe';
            }
        }

        async function listParticipants() {
            try {
                listBtn.disabled = true;
                listBtn.innerHTML = '<div class="spinner"></div>Chargement...';
                showStatus('🔄 Chargement de la liste des participants...', 'info');

                const db = firebase.database();
                const participantsRef = db.ref('participants');
                const snapshot = await participantsRef.once('value');
                
                if (!snapshot.exists()) {
                    showStatus('ℹ️ Aucun participant trouvé dans Firebase', 'info');
                    return;
                }

                const participants = snapshot.val();
                const participantsList = Object.entries(participants).map(([id, data]) => ({
                    id,
                    name: data.participantName,
                    lastUpdated: data.lastUpdated
                }));

                participantsContent.innerHTML = '';
                participantsList.forEach(participant => {
                    const item = document.createElement('div');
                    item.className = 'participant-item';
                    item.innerHTML = `
                        <strong>${participant.name}</strong><br>
                        <small>ID: ${participant.id}</small><br>
                        <small>Dernière mise à jour: ${new Date(participant.lastUpdated).toLocaleString('fr-FR')}</small>
                    `;
                    item.onclick = () => {
                        participantNameInput.value = participant.name;
                        participantsList.classList.remove('show');
                    };
                    participantsContent.appendChild(item);
                });

                participantsList.classList.add('show');
                showStatus(`✅ ${participantsList.length} participant(s) trouvé(s)`, 'success');

            } catch (error) {
                console.error('Erreur:', error);
                showStatus(`❌ Erreur lors du chargement: ${error.message}`, 'error');
            } finally {
                listBtn.disabled = false;
                listBtn.innerHTML = '📋 Liste des participants';
            }
        }

        resetBtn.addEventListener('click', resetPassword);
        listBtn.addEventListener('click', listParticipants);

        // Message de bienvenue
        showStatus('✨ Prêt à réinitialiser un mot de passe. Entrez le nom du participant ci-dessus.', 'info');
    </script>
</body>
</html>
