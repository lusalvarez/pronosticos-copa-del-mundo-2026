<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Débloquer Roberto</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 20px;
    }
    .info {
      background: #dbeafe;
      border-left: 4px solid #2563eb;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
      width: 100%;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    #status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #dc2626;
    }
    #status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #3b82f6;
    }
    .credentials {
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      border: 2px solid #e5e7eb;
    }
    .credentials p {
      margin: 10px 0;
      font-size: 18px;
    }
    .credentials strong {
      color: #1f2937;
    }
    .credentials .value {
      color: #2563eb;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔓 Débloquer Roberto</h1>
    
    <div class="info">
      <strong>ℹ️ Information :</strong> Ce script va créer un mot de passe pour Roberto dans Firebase.
    </div>

    <div class="credentials">
      <p><strong>Nom :</strong> <span class="value">Roberto</span></p>
      <p><strong>Mot de passe :</strong> <span class="value">1234</span></p>
    </div>

    <button onclick="unlockRoberto()">🔓 Créer le mot de passe pour Roberto</button>

    <div id="status"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = type;
      status.style.display = 'block';
    }

    async function unlockRoberto() {
      const name = "Roberto";
      const password = "1234";

      showStatus('🔄 Création du mot de passe en cours...', 'info');

      try {
        if (typeof firebase === 'undefined' || !firebase.database) {
          showStatus('❌ Firebase no está disponible', 'error');
          return;
        }

        const db = firebase.database();
        
        // Créer le mot de passe dans Firebase sous /passwords/Roberto
        await db.ref(`passwords/${name}`).set({
          name: name,
          password: password,
          createdAt: new Date().toISOString(),
          createdBy: 'admin-unlock-script'
        });

        showStatus(
          `✅ Mot de passe créé avec succès !\n\n` +
          `Roberto peut maintenant se connecter sur participant.html avec :\n` +
          `Nom: Roberto\n` +
          `Mot de passe: 1234`,
          'success'
        );

      } catch (error) {
        console.error('Error:', error);
        showStatus(`❌ Error: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
