<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin – Pronostics 8èmes de finale</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      margin: 0;
      padding: 1.5rem;
      color: #1f2328;
    }
    .page { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .subtitle { color: #57606a; margin: 0 0 1.5rem; font-size: 0.95rem; }
    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
    select, input[type="number"] {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      font-size: 0.95rem;
      background: #fff;
    }
    select { width: 100%; }
    .btn {
      display: inline-block;
      padding: 0.55rem 1.2rem;
      border-radius: 6px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82d4; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }
    .match-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      background: #fafafa;
    }
    .match-title { font-weight: 700; margin: 0 0 0.2rem; font-size: 1rem; }
    .match-date { color: #57606a; font-size: 0.82rem; margin: 0 0 0.8rem; }
    .inputs-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .inputs-row input[type="number"] { width: 64px; text-align: center; }
    .vs { font-weight: 700; color: #57606a; }
    .inputs-row select { flex: 1; min-width: 160px; }
    .badge-saved {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      border-radius: 4px;
      padding: 0.15rem 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .status {
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
      display: none;
    }
    .status.info    { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .status.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .status.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    #matches-section { display: none; }
    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="page">

  <h1>⚽ Pronostics 8èmes de finale — Saisie admin</h1>
  <p class="subtitle">Ajoute ou modifie les pronostics d'un participant existant pour les 8èmes de finale.</p>

  <!-- Étape 1 : Choisir le participant -->
  <div class="panel">
    <h2>1. Choisir le participant</h2>
    <div style="margin-bottom:1rem;">
      <label for="participant-select">Participant :</label>
      <select id="participant-select">
        <option value="">— Chargement… —</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadParticipantData()">Charger ses pronostics →</button>
    <div id="status-load" class="status"></div>
  </div>

  <!-- Étape 2 : Saisie des pronostics -->
  <div id="matches-section">
    <div class="panel">
      <h2 id="matches-title">2. Pronostics 8èmes de finale</h2>
      <div id="matches-list"></div>
    </div>

    <div class="panel" style="display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-success" onclick="saveAllPredictions()">✅ Enregistrer dans Firebase</button>
      <button class="btn btn-secondary" onclick="resetForm()">↩ Changer de participant</button>
    </div>
    <div id="status-save" class="status"></div>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
// ─── Helpers ──────────────────────────────────────────────────────────────────

function normalizeParticipantId(name) {
  return name
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().trim()
    .replace(/\s+/g, "-")
    .replace(/\./g, "_dot_").replace(/\$/g, "_dollar_")
    .replace(/#/g, "_hash_").replace(/\[/g, "_lbracket_")
    .replace(/\]/g, "_rbracket_").replace(/\//g, "_slash_")
    .replace(/@/g, "_at_");
}

function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString("fr-FR", {
    day: "2-digit", month: "2-digit",
    hour: "2-digit", minute: "2-digit"
  });
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `status ${type}`;
  el.style.display = "block";
}

function isOctavosMatch(match) {
  return match.stage && match.stage.includes("Octavos");
}

// ─── State ────────────────────────────────────────────────────────────────────

let allMatches      = [];   // tous les matchs Firebase, triés par ordre
let octavosMatches  = [];   // sous-ensemble 8èmes uniquement
let octavosIndexes  = [];   // index dans allMatches de chaque match des 8èmes
let participantData = null; // données brutes Firebase du participant
let selectedId      = "";   // participantId normalisé

// ─── Init : charger la liste des participants ──────────────────────────────────

window.addEventListener("DOMContentLoaded", async () => {
  try {
    const db = firebase.database();
    const snap = await db.ref("participants").once("value");
    const data = snap.val();
    const select = document.getElementById("participant-select");
    select.innerHTML = '<option value="">— Sélectionner —</option>';

    if (!data) {
      select.innerHTML = '<option value="">Aucun participant trouvé</option>';
      return;
    }

    // Trier par nom
    Object.entries(data)
      .sort((a, b) => a[1].participantName.localeCompare(b[1].participantName))
      .forEach(([id, pData]) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = pData.participantName;
        select.appendChild(opt);
      });

  } catch (e) {
    showStatus("status-load", "❌ Erreur chargement participants : " + e.message, "error");
  }
});

// ─── Charger les données du participant sélectionné ───────────────────────────

async function loadParticipantData() {
  const select = document.getElementById("participant-select");
  selectedId = select.value;
  if (!selectedId) {
    showStatus("status-load", "❌ Sélectionne un participant.", "error");
    return;
  }

  showStatus("status-load", "⏳ Chargement…", "info");
  document.getElementById("matches-section").style.display = "none";

  try {
    const db = firebase.database();

    // Charger le participant
    const pSnap = await db.ref(`participants/${selectedId}`).once("value");
    participantData = pSnap.val();
    if (!participantData) throw new Error("Participant introuvable dans Firebase.");

    // Charger TOUS les matchs Firebase
    const mSnap = await db.ref("matches").once("value");
    const rawMatches = mSnap.val();
    if (!rawMatches) throw new Error("Aucun match dans Firebase.");

    // Reconstituer le tableau dans le même ordre que participant-v4.js
    // (les matchs sont stockés avec des clés Firebase, on les trie par date puis par ordre d'ajout)
    const matchEntries = Object.entries(rawMatches)
      .filter(([, m]) => !m.addedManually && m.stage !== "Partido manual")
      .sort((a, b) => {
        const diff = new Date(a[1].date) - new Date(b[1].date);
        if (diff !== 0) return diff;
        return a[0].localeCompare(b[0]);
      });

    allMatches = matchEntries.map(([firebaseKey, m]) => ({ ...m, firebaseKey }));

    // Identifier les 8èmes de finale et leurs index dans le tableau complet
    octavosMatches  = [];
    octavosIndexes  = [];
    allMatches.forEach((m, idx) => {
      if (isOctavosMatch(m)) {
        octavosMatches.push(m);
        octavosIndexes.push(idx);
      }
    });

    if (octavosMatches.length === 0) {
      showStatus("status-load",
        "⚠️ Aucun match de 8èmes de finale trouvé dans Firebase. " +
        "Vérifie que les matchs ont bien le stage 'Octavos de final'.", "error");
      return;
    }

    const participantName = participantData.participantName;
    document.getElementById("matches-title").textContent =
      `2. Pronostics 8èmes de finale — ${participantName}`;

    renderOctavosMatches();
    document.getElementById("matches-section").style.display = "block";
    showStatus("status-load",
      `✅ ${participantName} chargé — ${octavosMatches.length} match(s) de 8èmes trouvés.`,
      "success");

  } catch (e) {
    showStatus("status-load", "❌ Erreur : " + e.message, "error");
  }
}

// ─── Afficher les matchs des 8èmes ────────────────────────────────────────────

function renderOctavosMatches() {
  const container = document.getElementById("matches-list");
  container.innerHTML = "";

  octavosMatches.forEach((match, i) => {
    const globalIdx = octavosIndexes[i];

    // Récupérer le pronostic existant (stocké à l'index dans le tableau predictions)
    const existingPred = participantData.predictions?.[globalIdx]?.prediction || {};
    const home   = existingPred.home         ?? "";
    const away   = existingPred.away         ?? "";
    const fg     = existingPred.firstGoal    || "";
    const pw     = existingPred.penaltyWinner || "";

    const hasPred = home !== "" && away !== "";

    const card = document.createElement("div");
    card.className = "match-card";
    card.innerHTML = `
      <p class="match-title">
        ${match.homeTeam} vs ${match.awayTeam}
        ${hasPred ? `<span class="badge-saved">✓ Pronostic existant : ${home}-${away}</span>` : ""}
      </p>
      <p class="match-date">📅 ${formatDate(match.date)} — ${match.stage}</p>
      <div class="inputs-row">
        <span style="font-size:0.85rem;color:#57606a;min-width:90px;text-align:right;">${match.homeTeam}</span>
        <input type="number" id="home-${i}" min="0" max="30" value="${home}" placeholder="—" />
        <span class="vs">–</span>
        <input type="number" id="away-${i}" min="0" max="30" value="${away}" placeholder="—" />
        <span style="font-size:0.85rem;color:#57606a;min-width:90px;">${match.awayTeam}</span>
      </div>
      <div class="inputs-row" style="margin-top:0.6rem;">
        <label style="margin:0;min-width:90px;font-size:0.82rem;">⚽ 1er but :</label>
        <select id="fg-${i}" style="flex:1;min-width:160px;">
          <option value="">— Pas de pronostic —</option>
          <option value="home" ${fg === "home" ? "selected" : ""}>${match.homeTeam}</option>
          <option value="away" ${fg === "away" ? "selected" : ""}>${match.awayTeam}</option>
        </select>
      </div>
      <div class="inputs-row" style="margin-top:0.6rem;">
        <label style="margin:0;min-width:90px;font-size:0.82rem;">🎯 Pénal. :</label>
        <select id="pw-${i}" style="flex:1;min-width:160px;">
          <option value="">— Si match nul uniquement —</option>
          <option value="home" ${pw === "home" ? "selected" : ""}>${match.homeTeam} gagne aux tirs au but</option>
          <option value="away" ${pw === "away" ? "selected" : ""}>${match.awayTeam} gagne aux tirs au but</option>
        </select>
      </div>
    `;
    container.appendChild(card);
  });
}

// ─── Sauvegarder dans Firebase ────────────────────────────────────────────────

async function saveAllPredictions() {
  showStatus("status-save", "⏳ Enregistrement…", "info");

  try {
    const db = firebase.database();
    const updates = {};

    // Mettre à jour la date de mise à jour
    updates[`participants/${selectedId}/lastUpdated`] = new Date().toISOString();

    let saved = 0;
    let skipped = 0;

    octavosMatches.forEach((match, i) => {
      const globalIdx = octavosIndexes[i];
      const homeVal = document.getElementById(`home-${i}`).value;
      const awayVal = document.getElementById(`away-${i}`).value;

      if (homeVal === "" || awayVal === "") {
        skipped++;
        return; // on ne touche pas à ce match si incomplet
      }

      const home = parseInt(homeVal, 10);
      const away = parseInt(awayVal, 10);
      const fg   = document.getElementById(`fg-${i}`).value;
      const pw   = document.getElementById(`pw-${i}`).value;

      // Validation : penaltyWinner seulement si score nul
      if (pw !== "" && home !== away) {
        throw new Error(
          `Erreur ${match.homeTeam} vs ${match.awayTeam} : ` +
          `le vainqueur aux tirs au but ne peut être sélectionné que si le score est nul (${home}-${away}).`
        );
      }

      // Écrire chaque champ individuellement (même format que sendToFirebaseWithValidation)
      const base = `participants/${selectedId}/predictions/${globalIdx}`;
      updates[`${base}/homeTeam`]              = match.homeTeam;
      updates[`${base}/awayTeam`]              = match.awayTeam;
      updates[`${base}/date`]                  = match.date;
      updates[`${base}/stage`]                 = match.stage;
      updates[`${base}/prediction/home`]       = home;
      updates[`${base}/prediction/away`]       = away;
      updates[`${base}/prediction/firstGoal`]  = fg;
      updates[`${base}/prediction/penaltyWinner`] = pw;

      saved++;
    });

    await db.ref().update(updates);

    showStatus("status-save",
      `✅ ${saved} pronostic(s) enregistré(s) pour ${participantData.participantName}.` +
      (skipped > 0 ? ` (${skipped} match(s) ignoré(s) car incomplets)` : ""),
      "success");

    // Recharger pour mettre à jour les badges
    await loadParticipantData();

  } catch (e) {
    showStatus("status-save", "❌ " + e.message, "error");
  }
}

// ─── Reset ────────────────────────────────────────────────────────────────────

function resetForm() {
  document.getElementById("participant-select").value = "";
  document.getElementById("matches-section").style.display = "none";
  document.getElementById("status-load").style.display = "none";
  document.getElementById("status-save").style.display = "none";
}
</script>
</body>
</html>
