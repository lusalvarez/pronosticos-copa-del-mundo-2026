<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Firebase Participants</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            background: #252526;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #569cd6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #3e3e42;
        }
        th {
            background: #1e1e1e;
            color: #4ec9b0;
            position: sticky;
            top: 0;
        }
        tr:hover {
            background: #2d2d30;
        }
        button {
            padding: 10px 20px;
            background: #c72e2e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #e03e3e;
        }
        .success {
            background: #1a3a1a;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #4ec9b0;
            margin: 20px 0;
        }
        .error {
            background: #3a1a1a;
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #f48771;
            margin: 20px 0;
        }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 200px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Firebase - Tous les Participants</h1>
        
        <div id="loading" class="loading">
            ⏳ Chargement des participants depuis Firebase...
        </div>

        <div id="output" style="display: none;"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Configuration Firebase -->
    <script src="firebase-config.js"></script>

    <script>
        let allParticipants = {};

        function loadAllParticipants() {
            const participantsRef = database.ref('participants');
            
            participantsRef.once('value')
                .then(snapshot => {
                    const loadingDiv = document.getElementById('loading');
                    const outputDiv = document.getElementById('output');

                    loadingDiv.style.display = 'none';
                    outputDiv.style.display = 'block';

                    allParticipants = snapshot.val();

                    if (!allParticipants || Object.keys(allParticipants).length === 0) {
                        outputDiv.innerHTML = '<div class="error">❌ Aucun participant trouvé dans Firebase</div>';
                        return;
                    }

                    const count = Object.keys(allParticipants).length;
                    
                    let html = `<div class="success">✅ ${count} participant(s) trouvé(s) dans Firebase</div>`;
                    
                    html += '<table>';
                    html += '<tr><th>Firebase ID</th><th>Nom</th><th>Pronostics</th><th>Données brutes</th><th>Action</th></tr>';
                    
                    Object.keys(allParticipants).forEach(firebaseId => {
                        const participant = allParticipants[firebaseId];
                        const participantName = participant.participantName || participant.name || '❓ Sans nom';
                        const predictionCount = participant.predictions ? participant.predictions.length : 0;
                        const rawData = JSON.stringify(participant, null, 2);
                        
                        html += '<tr>';
                        html += `<td><strong>${firebaseId}</strong></td>`;
                        html += `<td>${participantName}</td>`;
                        html += `<td>${predictionCount} pronostics</td>`;
                        html += `<td><pre>${rawData}</pre></td>`;
                        html += `<td><button onclick="deleteParticipant('${firebaseId}', '${participantName}')">🗑️ Supprimer</button></td>`;
                        html += '</tr>';
                    });
                    
                    html += '</table>';
                    
                    outputDiv.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('output').innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
                    document.getElementById('output').style.display = 'block';
                });
        }

        async function deleteParticipant(firebaseId, participantName) {
            if (!confirm(`⚠️ Voulez-vous vraiment supprimer le participant "${participantName}" (ID: ${firebaseId}) ?\n\nCette action est IRRÉVERSIBLE !`)) {
                return;
            }

            try {
                await database.ref('participants/' + firebaseId).remove();
                alert(`✅ Participant "${participantName}" supprimé avec succès !`);
                
                // Recharger la liste
                loadAllParticipants();
                
            } catch (error) {
                alert(`❌ Erreur lors de la suppression: ${error.message}`);
            }
        }

        // Charger au démarrage
        loadAllParticipants();
    </script>
</body>
</html>
