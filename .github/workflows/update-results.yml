name: Update Match Results Automatically

on:
  schedule:
    # Exécuter 4 fois par jour : 21h, minuit, 4h et 8h (heure UTC)
    # 21h Paris = 19h UTC
    # Minuit Paris = 22h UTC
    # 4h Paris = 2h UTC
    # 8h Paris = 6h UTC
    - cron: '0 19 * * *'  # 21h heure de Paris
    - cron: '0 22 * * *'  # Minuit heure de Paris
    - cron: '0 2 * * *'   # 4h du matin heure de Paris
    - cron: '0 6 * * *'   # 8h du matin heure de Paris
  workflow_dispatch:  # Permet aussi l'exécution manuelle depuis GitHub

jobs:
  update-results:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install firebase-admin node-fetch@2
      
      - name: Create update script
        run: |
          cat > update-results.js << 'EOF'
          const admin = require('firebase-admin');
          const fetch = require('node-fetch');

          // Configuration Firebase
          const serviceAccount = {
            type: "service_account",
            project_id: "pronostico-copa-del-mundo-2026",
            private_key_id: process.env.FIREBASE_PRIVATE_KEY_ID,
            private_key: process.env.FIREBASE_PRIVATE_KEY.replace(/\\n/g, '\n'),
            client_email: process.env.FIREBASE_CLIENT_EMAIL,
            client_id: process.env.FIREBASE_CLIENT_ID,
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token",
            auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs",
            client_x509_cert_url: process.env.FIREBASE_CERT_URL
          };

          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            databaseURL: "https://pronostico-copa-del-mundo-2026-default-rtdb.europe-west1.firebasedatabase.app"
          });

          const db = admin.database();
          const API_KEY = '96eea8d47bdd7070e11bdffe7159f5d3';

          async function updateResults() {
            try {
              console.log('🔄 Début de la mise à jour automatique des résultats...');
              console.log('⏰ Heure d\'exécution:', new Date().toISOString());
              
              // ÉTAPE 1: Récupérer TOUS les matchs terminés depuis l'API
              console.log('📡 Récupération des matchs terminés depuis l\'API Football...');
              const apiUrl = 'https://v3.football.api-sports.io/fixtures?league=1&season=2026&status=FT';
              
              const apiResponse = await fetch(apiUrl, {
                headers: {
                  'x-apisports-key': API_KEY
                }
              });
              
              const apiData = await apiResponse.json();
              
              if (!apiData.response || apiData.response.length === 0) {
                console.log('ℹ️ Aucun match terminé trouvé dans l\'API');
                console.log('📊 Statistiques: 0 mis à jour, 0 ignorés, 0 erreur(s)');
                process.exit(0);
              }
              
              console.log(`📊 ${apiData.response.length} match(s) terminé(s) trouvé(s) dans l\'API`);
              
              // ÉTAPE 2: Récupérer les matchs depuis Firebase
              console.log('📡 Récupération des matchs depuis Firebase...');
              const matchesSnapshot = await db.ref('matches').once('value');
              const matchesData = matchesSnapshot.val();
              
              if (!matchesData) {
                console.log('⚠️ Aucune donnée trouvée dans Firebase');
                process.exit(0);
              }
              
              // Convertir en tableau avec index
              const firebaseMatches = Array.isArray(matchesData) ? matchesData : Object.values(matchesData);
              const firebaseMatchesKeys = Array.isArray(matchesData) ?
                firebaseMatches.map((_, i) => i) :
                Object.keys(matchesData);
              
              console.log(`📊 ${firebaseMatches.length} match(s) dans Firebase`);
              
              let updatedCount = 0;
              let errorCount = 0;
              let skippedCount = 0;
              
              // ÉTAPE 3: Pour chaque match terminé de l'API, chercher dans Firebase
              for (const apiMatch of apiData.response) {
                try {
                  const homeTeam = apiMatch.teams.home.name;
                  const awayTeam = apiMatch.teams.away.name;
                  const homeScore = apiMatch.goals.home;
                  const awayScore = apiMatch.goals.away;
                  
                  // Chercher le match correspondant dans Firebase
                  let matchIndex = -1;
                  let firebaseMatch = null;
                  
                  for (let i = 0; i < firebaseMatches.length; i++) {
                    const fbMatch = firebaseMatches[i];
                    if (!fbMatch) continue;
                    
                    // Ignorer les matchs manuels
                    if (fbMatch.addedManually || fbMatch.stage === "Partido manual") {
                      continue;
                    }
                    
                    // Vérifier si c'est le même match (comparaison des noms d'équipes)
                    const homeMatch = homeTeam.toLowerCase().includes(fbMatch.homeTeam.toLowerCase().split(' ')[0]) ||
                                     fbMatch.homeTeam.toLowerCase().includes(homeTeam.toLowerCase().split(' ')[0]);
                    const awayMatch = awayTeam.toLowerCase().includes(fbMatch.awayTeam.toLowerCase().split(' ')[0]) ||
                                     fbMatch.awayTeam.toLowerCase().includes(awayTeam.toLowerCase().split(' ')[0]);
                    
                    if (homeMatch && awayMatch) {
                      matchIndex = i;
                      firebaseMatch = fbMatch;
                      break;
                    }
                  }
                  
                  if (matchIndex === -1) {
                    // Match non trouvé dans Firebase
                    console.log(`⏭️ ${homeTeam} vs ${awayTeam} - Non trouvé dans Firebase`);
                    skippedCount++;
                    continue;
                  }
                  
                  // Vérifier si le match a déjà des résultats
                  if (firebaseMatch.homeScore !== null && firebaseMatch.awayScore !== null) {
                    console.log(`⏭️ ${homeTeam} ${homeScore}-${awayScore} ${awayTeam} - Déjà mis à jour`);
                    skippedCount++;
                    continue;
                  }
                  
                  // MISE À JOUR: Le match est terminé dans l'API et n'a pas de résultat dans Firebase
                  const matchKey = firebaseMatchesKeys[matchIndex];
                  await db.ref(`matches/${matchKey}`).update({
                    homeScore: homeScore,
                    awayScore: awayScore
                  });
                  
                  console.log(`✅ ${homeTeam} ${homeScore}-${awayScore} ${awayTeam} - Mis à jour`);
                  updatedCount++;
                  
                } catch (error) {
                  console.error(`❌ Erreur:`, error.message);
                  errorCount++;
                }
              }
              
              // Sauvegarder les matchs mis à jour
              if (updatedCount > 0) {
                await db.ref('matches').set(matches);
                console.log(`\n✅ Mise à jour terminée: ${updatedCount} match(s) mis à jour`);
              } else {
                console.log('\nℹ️ Aucun nouveau résultat à mettre à jour');
              }
              
              console.log(`📊 Statistiques: ${updatedCount} mis à jour, ${skippedCount} ignorés, ${errorCount} erreur(s)`);
              
              process.exit(0);
              
            } catch (error) {
              console.error('❌ Erreur lors de la mise à jour:', error);
              process.exit(1);
            }
          }

          updateResults();
          EOF
      
      - name: Run update script
        env:
          FIREBASE_PRIVATE_KEY_ID: ${{ secrets.FIREBASE_PRIVATE_KEY_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_CLIENT_ID: ${{ secrets.FIREBASE_CLIENT_ID }}
          FIREBASE_CERT_URL: ${{ secrets.FIREBASE_CERT_URL }}
        run: node update-results.js

